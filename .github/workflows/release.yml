# On a v* tag: test, then build and publish a GitHub Release with GoReleaser, using that version's
# section of CHANGELOG.md as the notes, and attest the archives' provenance
# (check one with: gh attestation verify yass_linux_amd64.tar.gz --repo donjaime/yass).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write     # create the release
  id-token: write     # sign the attestations
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: go.mod }
      - run: go test ./...
      - run: go build -o bin/yass ./cmd/yass
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: YASS_BIN="$PWD/bin/yass" bash tests/e2e.sh && YASS_BIN="$PWD/bin/yass" bash tests/examples.sh
      - name: Release notes from CHANGELOG.md
        run: |
          notes() { awk -v v="$1" 'index($0, "## " v " ") == 1 || $0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"; test -s "$RUNNER_TEMP/notes.md"; }
          # A pre-release (0.2.0-rc.1) uses its own section if there is one, else the 0.2.0 section.
          v="${GITHUB_REF_NAME#v}"
          notes "$v" || notes "${v%%-*}" || { echo "::error::CHANGELOG.md has no '## $v' or '## ${v%%-*}' section"; exit 1; }
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with: { version: "v2.18.2", args: "release --clean --release-notes ${{ runner.temp }}/notes.md" }
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-checksums: ./dist/checksums.txt }
