# Publishes the landing page in site/ to https://donjaime.github.io/yass/ (Pages source: GitHub Actions).
# tests/site.sh --deploy runs first, so a page with placeholder assets is never published.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "tests/site.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write      # deploy to Pages
  id-token: write   # verify the deployment's origin
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/site.sh --deploy
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
